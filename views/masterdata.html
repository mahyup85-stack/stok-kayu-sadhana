<div class="card">
    <!-- Header dengan Judul & Tombol Tutup di kanan -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin: 0; font-size: 18px;">Kelola Master Data</h2>
        <button type="button" onclick="window.switchView('dashboard')"
            style="background: #a7aaa8e7; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;">
            Tutup
        </button>
    </div>
    <div class="form-group mb-3" style="margin-bottom: 20px;">
        <input type="text" id="master-input-name" placeholder="Nama Jenis Kayu / TPK..."
            style="width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;" />
        <input type="number" step="0.01" id="master-input-konversi" placeholder="Faktor Konversi (misal: 0.59)"
            style="width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;" />
        <button type="button" class="btn-primary"
            style="padding: 10px 20px; background-color: #0f766e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;"
            onclick="saveMasterItem()">Tambah / Update</button>
    </div>

    <div class="table-container"
        style="max-height: 400px; overflow-y: auto; margin-top: 15px; border: 1px solid #e2e8f0; border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
            <thead>
                <tr style="background: #f1f5f9;">
                    <th style="width: 50px; text-align: center; border-bottom: 1px solid #e2e8f0; padding: 10px;">No
                    </th>
                    <th style="border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left;">Nama</th>
                    <th id="th-faktor"
                        style="width: 100px; text-align: center; border-bottom: 1px solid #e2e8f0; padding: 10px;">
                        Faktor</th>
                    <th style="width: 80px; text-align: center; border-bottom: 1px solid #e2e8f0; padding: 10px;">Aksi
                    </th>
                </tr>
            </thead>
            <tbody id="master-list-body">
                <!-- Data dimuat dinamis -->
            </tbody>
        </table>
    </div>
</div>
